; ============================================================
; MONGO_GARDEN - ESP32-S3 (PlatformIO)
; Abrir en VS Code la carpeta que contiene platformio.ini.
; Proyecto para macOS y Windows.
; ============================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; ============================================================
; FLASH
; El registro de arranque detecta 4 MB.
; Sobrescribe los 8 MB predeterminados del perfil de placa.
; ============================================================
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; ============================================================
; MONITOR SERIAL
; ============================================================
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================
; USB NATIVO
; Serial por el conector USB nativo del ESP32-S3.
; ============================================================
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; ============================================================
; LIBRERIAS
; ArduinoJson se mantiene en la rama 6.x.
; Las otras dependencias no tienen version fijada.
; ============================================================
lib_ldf_mode = chain

lib_deps =
    makuna/RTC
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    256dpi/MQTT
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit BMP085 Library
    links2004/WebSockets
    adafruit/Adafruit TSL2561
    adafruit/Adafruit AHTX0
    adafruit/Adafruit BusIO